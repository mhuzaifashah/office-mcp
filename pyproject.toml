[project]
name = "office-mcp"
version = "0.1.0"
description = "MCP servers for live Microsoft Office (Word, Excel, PowerPoint) control over COM"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
keywords = ["mcp", "model-context-protocol", "microsoft-word", "word", "office", "com", "automation", "ai-agents", "claude", "windows"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Topic :: Office/Business :: Office Suites",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
authors = [
    { name = "Muhammad Huzaifa", email = "151254717+mhuzaifashah@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pywin32>=311; sys_platform == 'win32'",
    "pymupdf>=1.24",
    "pillow>=11",
    "xlwings>=0.33",
    "mcp>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/mhuzaifashah/office-mcp"
Repository = "https://github.com/mhuzaifashah/office-mcp"
Documentation = "https://github.com/mhuzaifashah/office-mcp/blob/main/docs/tool-reference.md"
Issues = "https://github.com/mhuzaifashah/office-mcp/issues"

[project.optional-dependencies]
equations = ["latex2mathml>=3.77"]

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.12", "ruff>=0.8"]

[project.scripts]
office-mcp = "office_mcp:main"

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: requires a running Microsoft Word installation",
    "e2e: full lifecycle against live Word (implies smoke)",
]
addopts = "-m 'not smoke and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702"]

[tool.ruff.format]
line-ending = "lf"
