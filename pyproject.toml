[project]
name = "office-mcp"
version = "0.1.0"
description = "MCP servers for live Microsoft Office (Word, Excel, PowerPoint) control over COM"
readme = "README.md"
authors = [
    { name = "Muhammad Huzaifa", email = "151254717+mhuzaifashah@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "pywin32>=311",
    "pymupdf>=1.24",
    "pillow>=11",
    "xlwings>=0.33",
    "mcp>=2.3,<3",
]

[project.optional-dependencies]
equations = ["latex2mathml>=3.77"]

[dependency-groups]
dev = ["pytest>=8", "pytest-mock>=3.12", "ruff>=0.8"]

[project.scripts]
office-mcp = "office_mcp:main"

[build-system]
requires = ["uv_build>=0.8.16,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "smoke: requires a running Microsoft Word installation",
    "e2e: full lifecycle against live Word (implies smoke)",
]
addopts = "-m 'not smoke and not e2e'"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E702"]

[tool.ruff.format]
line-ending = "lf"
